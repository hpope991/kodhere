<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artwork — Kodhere</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <a href="index.html" class="brand">
    <span class="logo">Kodhere</span>
    <span class="tagline">Isle of Man</span>
  </a>
  <nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="archive.html">Archive</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="page">
  <section class="artwork-detail" id="artwork-detail">
    <a href="gallery.html" class="back-link">&larr; Back to gallery</a>
    <div class="artwork-content">
      <div class="artwork-gallery">
        <div class="slider">
          <button class="slider-arrow slider-prev" aria-label="Previous image">&larr;</button>
          <img id="artwork-image" src="" alt="" />
          <button class="slider-arrow slider-next" aria-label="Next image">&rarr;</button>
        </div>
        <div class="thumbs" id="artwork-thumbs"></div>
      </div>
      <div class="artwork-info">
        <h1 id="artwork-title"></h1>
        <p class="meta"><span id="artwork-medium"></span> &middot; <span id="artwork-size"></span> &middot; <span id="artwork-year"></span></p>
        <p class="price" id="artwork-price"></p>
        <p class="description" id="artwork-description"></p>
        <a id="enquire-btn" class="btn" href="#">Enquire to buy</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <p>&copy; <span id="year"></span> Kodhere &middot; Isle of Man</p>
</footer>

<script src="js/artworks.js"></script>
<script src="js/main.js"></script>
</body>
</html>
