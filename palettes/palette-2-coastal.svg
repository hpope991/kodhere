<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, serif">
  <rect width="1000" height="620" fill="#e8ece8"/>
  <text x="40" y="45" font-size="26" fill="#1a2a3a">Palette 2 — Coastal (Isle of Man)</text>

  <!-- 2a LIGHT -->
  <text x="40" y="95" font-size="18" fill="#1a2a3a">2a — Light</text>
  <g font-size="12" fill="#1a2a3a" text-anchor="middle">
    <rect x="40"  y="110" width="170" height="120" fill="#f5f3ef" stroke="#c8ccd2"/>
    <text x="125" y="250">#F5F3EF Sea Foam (bg)</text>
    <rect x="230" y="110" width="170" height="120" fill="#b8c5d0"/>
    <text x="315" y="250">#B8C5D0 Misty Blue</text>
    <rect x="420" y="110" width="170" height="120" fill="#8a9aa8"/>
    <text x="505" y="250">#8A9AA8 Stone</text>
    <rect x="610" y="110" width="170" height="120" fill="#3e5468"/>
    <text x="695" y="250">#3E5468 Deep Sea (accent)</text>
    <rect x="800" y="110" width="170" height="120" fill="#d4b896"/>
    <text x="885" y="250">#D4B896 Sand</text>
  </g>

  <!-- 2b DARK -->
  <text x="40" y="325" font-size="18" fill="#1a2a3a">2b — Dark</text>
  <g font-size="12" fill="#1a2a3a" text-anchor="middle">
    <rect x="40"  y="340" width="170" height="120" fill="#121a24"/>
    <text x="125" y="480">#121A24 Midnight Bg</text>
    <rect x="230" y="340" width="170" height="120" fill="#25384a"/>
    <text x="315" y="480">#25384A Deep Sea</text>
    <rect x="420" y="340" width="170" height="120" fill="#7a95ae"/>
    <text x="505" y="480">#7A95AE Misty Blue (accent)</text>
    <rect x="610" y="340" width="170" height="120" fill="#d4b896"/>
    <text x="695" y="480">#D4B896 Sand</text>
    <rect x="800" y="340" width="170" height="120" fill="#e8eef4"/>
    <text x="885" y="480">#E8EEF4 Sea Foam (text)</text>
  </g>

  <rect x="40" y="520" width="460" height="70" fill="#f5f3ef" stroke="#c8ccd2"/>
  <text x="60" y="555" font-size="16" fill="#1a2a3a">Kodhere</text>
  <text x="60" y="578" font-size="12" fill="#3e5468">2a — light mode preview</text>
  <rect x="540" y="520" width="420" height="70" fill="#121a24"/>
  <text x="560" y="555" font-size="16" fill="#e8eef4">Kodhere</text>
  <text x="560" y="578" font-size="12" fill="#7a95ae">2b — dark mode preview</text>
</svg>
