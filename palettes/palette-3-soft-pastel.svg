<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, serif">
  <rect width="1000" height="620" fill="#efe8e8"/>
  <text x="40" y="45" font-size="26" fill="#3a2a32">Palette 3 — Soft Pastel</text>

  <!-- 3a LIGHT -->
  <text x="40" y="95" font-size="18" fill="#3a2a32">3a — Light</text>
  <g font-size="12" fill="#3a2a32" text-anchor="middle">
    <rect x="40"  y="110" width="170" height="120" fill="#fdf7f3" stroke="#e0d0c8"/>
    <text x="125" y="250">#FDF7F3 Blush Cream (bg)</text>
    <rect x="230" y="110" width="170" height="120" fill="#e8c5b8"/>
    <text x="315" y="250">#E8C5B8 Dusty Rose</text>
    <rect x="420" y="110" width="170" height="120" fill="#c4a7a8"/>
    <text x="505" y="250">#C4A7A8 Mauve (accent)</text>
    <rect x="610" y="110" width="170" height="120" fill="#a8b5a0"/>
    <text x="695" y="250">#A8B5A0 Sage</text>
    <rect x="800" y="110" width="170" height="120" fill="#5a4048"/>
    <text x="885" y="250">#5A4048 Plum (text)</text>
  </g>

  <!-- 3b DARK -->
  <text x="40" y="325" font-size="18" fill="#3a2a32">3b — Dark</text>
  <g font-size="12" fill="#3a2a32" text-anchor="middle">
    <rect x="40"  y="340" width="170" height="120" fill="#1f1618"/>
    <text x="125" y="480">#1F1618 Deep Plum Bg</text>
    <rect x="230" y="340" width="170" height="120" fill="#3d2a30"/>
    <text x="315" y="480">#3D2A30 Dark Plum</text>
    <rect x="420" y="340" width="170" height="120" fill="#d89a8a"/>
    <text x="505" y="480">#D89A8A Rose (accent)</text>
    <rect x="610" y="340" width="170" height="120" fill="#9aa88e"/>
    <text x="695" y="480">#9AA88E Sage</text>
    <rect x="800" y="340" width="170" height="120" fill="#f5e8e2"/>
    <text x="885" y="480">#F5E8E2 Blush (text)</text>
  </g>

  <rect x="40" y="520" width="460" height="70" fill="#fdf7f3" stroke="#e0d0c8"/>
  <text x="60" y="555" font-size="16" fill="#5a4048">Kodhere</text>
  <text x="60" y="578" font-size="12" fill="#c4a7a8">3a — light mode preview</text>
  <rect x="540" y="520" width="420" height="70" fill="#1f1618"/>
  <text x="560" y="555" font-size="16" fill="#f5e8e2">Kodhere</text>
  <text x="560" y="578" font-size="12" fill="#d89a8a">3b — dark mode preview</text>
</svg>
