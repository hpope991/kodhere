<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, serif">
  <rect width="1000" height="620" fill="#ececec"/>
  <text x="40" y="45" font-size="26" fill="#1a1a1a">Palette 4 — Modern Mono</text>

  <!-- 4a LIGHT -->
  <text x="40" y="95" font-size="18" fill="#1a1a1a">4a — Light</text>
  <g font-size="12" fill="#1a1a1a" text-anchor="middle">
    <rect x="40"  y="110" width="170" height="120" fill="#ffffff" stroke="#d0d0d0"/>
    <text x="125" y="250">#FFFFFF White (bg)</text>
    <rect x="230" y="110" width="170" height="120" fill="#f0ede7"/>
    <text x="315" y="250">#F0EDE7 Off-white</text>
    <rect x="420" y="110" width="170" height="120" fill="#a8a8a8"/>
    <text x="505" y="250">#A8A8A8 Mid Grey</text>
    <rect x="610" y="110" width="170" height="120" fill="#1a1a1a"/>
    <text x="695" y="250">#1A1A1A Near Black (text)</text>
    <rect x="800" y="110" width="170" height="120" fill="#b08a3e"/>
    <text x="885" y="250">#B08A3E Gold (accent)</text>
  </g>

  <!-- 4b DARK -->
  <text x="40" y="325" font-size="18" fill="#1a1a1a">4b — Dark</text>
  <g font-size="12" fill="#1a1a1a" text-anchor="middle">
    <rect x="40"  y="340" width="170" height="120" fill="#0e0e0e"/>
    <text x="125" y="480">#0E0E0E True Black Bg</text>
    <rect x="230" y="340" width="170" height="120" fill="#222222"/>
    <text x="315" y="480">#222222 Charcoal</text>
    <rect x="420" y="340" width="170" height="120" fill="#707070"/>
    <text x="505" y="480">#707070 Grey</text>
    <rect x="610" y="340" width="170" height="120" fill="#d4a656"/>
    <text x="695" y="480">#D4A656 Gold (accent)</text>
    <rect x="800" y="340" width="170" height="120" fill="#f5f5f5"/>
    <text x="885" y="480">#F5F5F5 Light (text)</text>
  </g>

  <rect x="40" y="520" width="460" height="70" fill="#ffffff" stroke="#d0d0d0"/>
  <text x="60" y="555" font-size="16" fill="#1a1a1a">Kodhere</text>
  <text x="60" y="578" font-size="12" fill="#b08a3e">4a — light mode preview</text>
  <rect x="540" y="520" width="420" height="70" fill="#0e0e0e"/>
  <text x="560" y="555" font-size="16" fill="#f5f5f5">Kodhere</text>
  <text x="560" y="578" font-size="12" fill="#d4a656">4b — dark mode preview</text>
</svg>
