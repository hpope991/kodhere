<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Colour Palettes — Kodhere</title>
<style>
  body { font-family: Georgia, serif; background: #f2efe9; margin: 0; padding: 2rem; color: #2b2b2b; }
  h1 { text-align: center; font-weight: normal; letter-spacing: 0.05em; }
  p.intro { text-align: center; color: #6b6b6b; max-width: 600px; margin: 0 auto 2rem; }
  .palette { max-width: 1000px; margin: 1.5rem auto; display: block; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
</style>
</head>
<body>
  <h1>Choose a colour palette</h1>
  <p class="intro">Five palettes, each with a light (a) and dark (b) version. Pick any combination you like — e.g. "2a" for coastal light, "5b" for botanical dark. The site can switch between light/dark with a small toggle button if you'd like.</p>
  <img class="palette" src="palette-1-warm-earth.svg" alt="Warm Earth">
  <img class="palette" src="palette-2-coastal.svg" alt="Coastal">
  <img class="palette" src="palette-3-soft-pastel.svg" alt="Soft Pastel">
  <img class="palette" src="palette-4-modern-mono.svg" alt="Modern Mono">
  <img class="palette" src="palette-5-botanical.svg" alt="Botanical">
</body>
</html>
